name: build
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q Tarjoman.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK (normal)
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: Tarjoman

      - name: Keep the normal APK
        run: |
          mkdir -p out/normal
          cp Tarjoman/app/build/outputs/apk/debug/*.apk out/normal/Tarjoman.apk

      # Second APK with the LiteRT-LM engine: needed for .litertlm models (Qwen3 0.6B int4, Gemma 3n ...).
      - name: Build APK (with LiteRT-LM)
        id: lm
        continue-on-error: true
        run: gradle assembleDebug -Plitertlm --no-daemon --stacktrace
        working-directory: Tarjoman

      - name: Keep the LiteRT-LM APK
        if: steps.lm.outcome == 'success'
        run: |
          mkdir -p out/litertlm
          cp Tarjoman/app/build/outputs/apk/debug/*.apk out/litertlm/Tarjoman-litertlm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tarjoman-apk
          path: out/normal/*.apk

      - uses: actions/upload-artifact@v4
        if: steps.lm.outcome == 'success'
        with:
          name: Tarjoman-apk-litertlm
          path: out/litertlm/*.apk
